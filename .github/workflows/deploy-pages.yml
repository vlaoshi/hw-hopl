# 프론트엔드 체험판을 GitHub Pages에 배포해요.
# - main 브랜치에 코드를 올리면(push) 자동으로 실행돼요. (Actions 탭에서 직접 실행도 가능)
# - 백엔드 서버 없이 동작하도록 체험 모드(VITE_DEMO_MODE=true)로 빌드해요.
# - 주소 앞에 저장소 이름이 붙으므로(예: https://아이디.github.io/hw-mall/) --base 로 맞춰요.
name: 프론트엔드 체험판 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 패키지 설치
        run: npm ci

      - name: 체험 모드로 빌드
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_DEMO_MODE: 'true'

      # /harbor 같은 주소로 바로 들어오거나 새로고침해도 화면이 뜨도록 404.html 을 index.html 과 같게 만들어요.
      - name: 새로고침 대비 404 페이지 만들기
        run: cp dist/index.html dist/404.html

      - name: 배포할 파일 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
